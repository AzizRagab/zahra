[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zahra"
version = "2.0.0"
description = "ZAHRA - Agentic Pentest System with autonomous AI brain"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Amshararou", email = "contact@zahra.ai"}
]
keywords = ["pentest", "security", "ai", "autonomous", "swarm", "red-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"

dependencies = [
    "pyfiglet>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.0.0",
    "anthropic>=0.8.0",
    "chromadb>=0.4.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "websockets>=11.0",
    "numpy>=1.24.0",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "gradio>=4.0.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]

[project.scripts]
zahra = "interfaces.cli:main"

[project.urls]
Homepage = "https://github.com/amshararou/zahra"
Documentation = "https://github.com/amshararou/zahra#readme"
Repository = "https://github.com/amshararou/zahra"
"Bug Tracker" = "https://github.com/amshararou/zahra/issues"

[tool.setuptools]
packages = ["ai_engine", "agents", "core", "ai_agent", "interfaces"]
py-modules = ["zahra_agent"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.json", "*.html", "*.css", "*.js"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true